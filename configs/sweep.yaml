model: EleutherAI/pythia-160m
dataset: monology/pile-uncopyrighted
layers: [3, 6, 9]
# omit `conditions` to get the three comparison arms plus the three nulls
conditions: [trained, rand_excl_emb, step0_excl_emb, control, step0, rand_incl_emb]

out: results/sweep.json
seed: 0
device: auto
mixed_precision: bf16
cache_dir: cache/tokens
wandb_project: do-bsfs-suck
ioi: false

n_tokens: 100000000
# 3,906 samples per block at the sparsest A=32 (per-block count is
# eval_tokens*A/16384, so it depends on A alone once G*b is fixed);
# 200k gave 390, too thin for a b=16 block Gram's stable rank
eval_tokens: 2000000

grid:
  kind: main
  dict_dims: 16384

shuffled:
  enabled: true
  block_dims: [4, 8, 16]
  active_dims: 64

train:
  # sqrt-scaled from 3e-4 at batch_tokens=4096; large batches want a
  # higher LR, not lower, and 100M/65536 is only 1,525 steps to converge in
  lr: 1.2e-3
  batch_tokens: 65536
  warmup_frac: 0.02
  # featurizers per stream pass; each carries its own Adam state
  parallel: 8
  dead_after_tokens: 10000000
  aux_k: 64
  aux_coeff: 0.03125
  grad_clip: 1.0
  log_every: 200

randomize:
  resample_layernorm: false
  freeze_unembed: true
  control_per_occurrence: true
