[project]
name = "do-bsfs-suck"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "aletheiaaaaa", email = "carbon674@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "datasets>=5.0.1",
    "matplotlib>=3.11.1",
    "numpy>=2.4.6",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
    "torch>=2.13.0",
    "tqdm>=4.70.0",
    "transformers>=5.15.0",
